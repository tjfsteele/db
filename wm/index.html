<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Meters</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0;
      color: var(--text-main);
    }

    .btn-refresh {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-refresh:hover {
      background-color: var(--primary-hover);
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 14px 20px;
    }

    th {
      background-color: #f8fafc;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-color);
    }

    tr:not(:last-child) td {
      border-bottom: 1px solid var(--border-color);
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    .serial-badge {
      font-family: monospace;
      font-weight: 600;
      font-size: 0.95rem;
      color: #1e293b;
      background-color: #f1f5f9;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
    }

    .volume-val {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .status-bar {
      padding: 12px 20px;
      background-color: #f8fafc;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .error-msg {
      color: #ef4444;
      padding: 20px;
      text-align: center;
    }

    .empty-msg {
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Water Meters</h1>
    <button class="btn-refresh" onclick="fetchData()">Refresh Now</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Meter Serial</th>
          <th>Volume (m³)</th>
          <th>Last Seen</th>
        </tr>
      </thead>
      <tbody id="meter-table-body">
        <tr>
          <td colspan="3" class="empty-msg">Loading meter data...</td>
        </tr>
      </tbody>
    </table>
    <div class="status-bar">
      <span id="meter-count">0 meters loaded</span>
      <span id="last-updated">Last checked: Never</span>
    </div>
  </div>
</div>

<script>
  const NPOINT_URL = "https://api.npoint.io/db901a388c579b2dc192";

  async function fetchData() {
    const tbody = document.getElementById('meter-table-body');
    const statusCount = document.getElementById('meter-count');
    const statusUpdated = document.getElementById('last-updated');

    try {
      const response = await fetch(NPOINT_URL, { cache: "no-store" });
      
      if (!response.ok) {
        throw new Error(`HTTP Error ${response.status}`);
      }

      const data = await response.json();
      const serials = Object.keys(data);

      tbody.innerHTML = '';

      if (serials.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="empty-msg">No meter readings found in snapshot.</td></tr>`;
        statusCount.textContent = '0 meters loaded';
        return;
      }

      serials.forEach(serial => {
        const item = data[serial];
        const volumeM3 = Number(item.volume_m3 || 0);
        
        let formattedDate = item.timestamp;
        if (item.timestamp) {
          const d = new Date(item.timestamp);
          formattedDate = d.toLocaleString();
        }

        const row = document.createElement('tr');
        row.innerHTML = `
          <td><span class="serial-badge">${serial}</span></td>
          <td class="volume-val">${volumeM3.toFixed(3)} m³</td>
          <td>${formattedDate}</td>
        `;
        tbody.appendChild(row);
      });

      statusCount.textContent = `${serials.length} meter${serials.length > 1 ? 's' : ''} loaded`;
      statusUpdated.textContent = `Last checked: ${new Date().toLocaleTimeString()}`;

    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="3" class="error-msg">Failed to load data: ${err.message}</td></tr>`;
      statusUpdated.textContent = `Last check failed: ${new Date().toLocaleTimeString()}`;
    }
  }

  fetchData();
  setInterval(fetchData, 30000);
</script>

</body>
</html>
